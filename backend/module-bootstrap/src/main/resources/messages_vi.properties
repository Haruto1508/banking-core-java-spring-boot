# General Errors
error.general.internal_server=Đã xảy ra lỗi hệ thống không mong muốn. Vui lòng liên hệ hỗ trợ.
error.general.invalid_payload=Dữ liệu yêu cầu không hợp lệ. Vui lòng kiểm tra lại.
error.general.validation_failed=Dữ liệu biểu mẫu không đáp ứng yêu cầu xác thực.
error.general.resource_not_found=Không tìm thấy tài nguyên được yêu cầu.

# Authentication & Authorization Errors
error.auth.unauthorized=Yêu cầu xác thực tài khoản để truy cập chức năng này.
error.auth.access_denied=Bạn không có quyền thực hiện hành động này.
error.auth.account_locked=Tài khoản tạm thời bị khóa do nhập sai mật khẩu nhiều lần.
error.auth.invalid_credentials=Tên đăng nhập hoặc mật khẩu không chính xác.
error.auth.user_already_exists=Tên đăng nhập hoặc email đã được đăng ký trên hệ thống.
error.auth.invalid_token=Phiên đăng nhập không hợp lệ hoặc đã hết hạn. Vui lòng đăng nhập lại.
error.auth.user_not_found=Không tìm thấy tài khoản người dùng tương ứng.

# Customer & Profile Errors
error.customer.already_exists=Hồ sơ khách hàng đã tồn tại với số CCCD hoặc email này.
error.customer.not_found=Không tìm thấy hồ sơ định danh khách hàng (CIF).
error.customer.already_linked=Tài khoản người dùng đã được liên kết với một hồ sơ khách hàng khác.
error.customer.invalid_status=Trạng thái khách hàng không hợp lệ để thực hiện thao tác.

# Account Errors
error.account.not_found=Không tìm thấy tài khoản ngân hàng.
error.account.frozen=Tài khoản đang trong trạng thái phong tỏa, không thể thực hiện giao dịch ghi nợ.
error.account.closed=Tài khoản ngân hàng này đã bị đóng.
error.account.has_remaining_balance=Không thể đóng tài khoản khi vẫn còn số dư khả dụng. Vui lòng tất toán trước.

# Transaction & Financial Errors
error.transaction.insufficient_balance=Số dư khả dụng không đủ để hoàn thành giao dịch chuyển tiền.
error.transaction.currency_mismatch=Tài khoản nguồn và tài khoản đích phải cùng loại tiền tệ.
error.transaction.invalid_amount=Số tiền giao dịch phải lớn hơn 0.
error.transaction.same_account=Tài khoản thụ hưởng phải khác tài khoản trích tiền.
error.transaction.idempotency_conflict=Giao dịch với mã Idempotency-Key này đang được xử lý song song.
error.transaction.idempotency_payload_mismatch=Mã Idempotency-Key đã được sử dụng với nội dung giao dịch khác.
error.transaction.already_reversed=Giao dịch này đã được hoàn tác trước đó.

# Ledger & Payment Errors
error.ledger.unbalanced=Vi phạm nguyên tắc sổ cái kép: Tổng Nợ (Debit) phải bằng Tổng Có (Credit).
error.payment.failed=Thao tác thanh toán hóa đơn thất bại.
error.payment.not_found=Không tìm thấy giao dịch thanh toán hóa đơn.

# API Success Messages
api.success.operation_completed=Thao tác đã được thực hiện thành công.
api.success.created=Tạo mới tài nguyên thành công.
