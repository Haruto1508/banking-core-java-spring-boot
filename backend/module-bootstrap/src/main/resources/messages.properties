# General Errors
error.general.internal_server=An unexpected error occurred. Please contact support.
error.general.invalid_payload=Invalid request payload. Please check your input.
error.general.validation_failed=Validation failed for request fields.
error.general.resource_not_found=Requested resource was not found.

# Authentication & Authorization Errors
error.auth.unauthorized=Full authentication is required to access this resource.
error.auth.access_denied=Access is denied for this action.
error.auth.account_locked=User account is locked due to multiple failed login attempts.
error.auth.invalid_credentials=Invalid username or password.
error.auth.user_already_exists=Username or email is already registered.
error.auth.invalid_token=Token is invalid, expired, or has been revoked.
error.auth.user_not_found=User account not found.

# Customer & Profile Errors
error.customer.already_exists=Customer already exists with given identity number or email.
error.customer.not_found=Customer profile not found.
error.customer.already_linked=User already has an associated customer profile.
error.customer.invalid_status=Customer is not in a valid status for this operation.

# Account Errors
error.account.not_found=Bank account not found.
error.account.frozen=Bank account is frozen and cannot process debit transactions.
error.account.closed=Bank account is closed.
error.account.has_remaining_balance=Account cannot be closed because it still has remaining balance.

# Transaction & Financial Errors
error.transaction.insufficient_balance=Insufficient available balance to complete the transaction.
error.transaction.currency_mismatch=Source and target accounts must share the same currency.
error.transaction.invalid_amount=Transaction amount must be strictly greater than zero.
error.transaction.same_account=Source and target accounts must be different.
error.transaction.idempotency_conflict=Concurrent request with the same Idempotency-Key is already in progress.
error.transaction.idempotency_payload_mismatch=Idempotency key was previously used with a different payload.
error.transaction.already_reversed=Transaction has already been reversed.

# Ledger & Payment Errors
error.ledger.unbalanced=Double-entry violation: Total debits must equal total credits.
error.payment.failed=Payment operation failed.
error.payment.not_found=Payment record not found.

# API Success Messages
api.success.operation_completed=Operation completed successfully.
api.success.created=Resource created successfully.
